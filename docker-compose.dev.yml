services:
  snapjaw:
    build: .
    image: snapjaw:dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      SNAPJAW_DATA_DIR: /data
    ports:
      - "3000:3000"
      - "2587:2587"
      - "2465:2465"
    volumes:
      - snapjaw-dev-data:/data

volumes:
  snapjaw-dev-data:
